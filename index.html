<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW문제해결 알고리즘 학습</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ext-language_tools.js"></script>
    
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #94a3b8; }
        
        .loader {
            width: 16px; height: 16px;
            border: 2px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .chevron { transition: transform 0.2s ease-in-out; }
        .chevron.open { transform: rotate(90deg); }

        /* 드래그 중 에디터 텍스트 선택 방지 */
        .resizing-active { user-select: none; pointer-events: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800 bg-slate-100">

    <header class="bg-white shadow-sm z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                </svg>
                <h1 class="text-lg md:text-xl font-bold text-slate-800 truncate">SW문제해결 알고리즘 학습</h1>
            </div>
            <div id="status-badge" class="flex items-center px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs md:text-sm font-semibold whitespace-nowrap">
                <span class="loader" id="loader-spinner"></span>
                <span id="status-text" class="ml-1">엔진 로딩 중...</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-2 md:p-4 gap-4 relative">
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 md:z-auto w-72 md:w-64 flex-shrink-0 bg-white rounded-r-xl md:rounded-xl shadow-lg border border-slate-200 flex flex-col overflow-hidden transform -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <h2 class="font-bold text-slate-700">학습 목차</h2>
                <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar" id="topic-list">
                <!-- 목차 렌더링 영역 -->
            </div>
        </aside>

        <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-20 hidden md:hidden"></div>

        <section class="flex-1 flex flex-col min-w-0 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 md:p-5 border-b border-slate-200 bg-slate-50 overflow-y-auto max-h-40 md:max-h-48 custom-scrollbar flex-shrink-0">
                <h2 id="concept-title" class="text-xl md:text-2xl font-bold text-slate-800 mb-2"></h2>
                <div id="concept-desc" class="text-slate-600 leading-relaxed text-sm md:text-base"></div>
            </div>

            <div id="workspace-container" class="flex-1 flex flex-col min-h-0 relative">
                <div class="px-3 md:px-4 py-2 bg-slate-800 text-slate-300 flex flex-wrap justify-between items-center text-xs md:text-sm border-b border-slate-700 gap-2 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <span class="font-mono text-xs bg-slate-700 text-blue-300 px-2 py-0.5 rounded">Python 3</span>
                        <span class="text-slate-400 text-xs hidden sm:inline">(Ctrl+Enter: 실행 / 자동 저장)</span>
                    </div>
                    <div class="flex items-center gap-1.5 md:gap-2">
                        <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition-colors flex items-center text-xs">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 초기화
                        </button>
                        <button id="copy-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition-colors flex items-center text-xs">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> 복사
                        </button>
                        <button id="run-btn" disabled class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded disabled:bg-slate-600 flex items-center font-semibold text-xs">
                            <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg> 코드 실행
                        </button>
                    </div>
                </div>
                
                <!-- 에디터 영역 (Flex-basis를 통해 크기 조절) -->
                <div id="editor-container" class="relative w-full" style="flex: 1 1 50%; min-height: 100px;">
                    <div id="editor" class="absolute inset-0 w-full h-full"></div>
                </div>

                <!-- 드래그 리사이저 바 -->
                <div id="drag-handle-terminal" class="h-2.5 bg-slate-200 hover:bg-blue-400 cursor-row-resize flex items-center justify-center transition-colors flex-shrink-0 z-10">
                    <div class="w-10 h-1 bg-slate-400 rounded-full pointer-events-none"></div>
                </div>

                <!-- 터미널 영역 -->
                <div id="terminal-container" class="bg-[#1e1e1e] flex flex-col flex-shrink-0 w-full" style="flex: 1 1 50%; min-height: 100px;">
                    <div class="px-3 md:px-4 py-1.5 bg-slate-900 text-slate-400 text-xs font-mono flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span>TERMINAL OUTPUT</span>
                            <span id="exec-time" class="text-[11px] text-slate-500"></span>
                        </div>
                        <button id="clear-btn" class="hover:text-slate-200 px-1.5 py-0.5 rounded hover:bg-slate-800">Clear</button>
                    </div>
                    <pre id="output" class="flex-1 p-3 md:p-4 font-mono text-xs md:text-sm text-slate-300 overflow-y-auto custom-scrollbar m-0 whitespace-pre-wrap select-text"></pre>
                </div>
            </div>
        </section>
    </main>

    <script>
        let editor;
        let pyodideInstance = null;
        let currentTopicId = null;
        let isExecuting = false;
        let expandedGroups = { '1': true, '2': false, '3': false, '4': false, '5': false, '6': false, '7': false };

        const groupTitles = {
            '1': 'Step 1. 배열과 기본 정렬',
            '2': 'Step 2. 2차원 배열과 검색',
            '3': 'Step 3. 문자열 매칭',
            '4': 'Step 4. 스택과 탐색 응용',
            '5': 'Step 5. 큐와 탐색 활용',
            '6': 'Step 6. 트리와 힙',
            '7': 'Step 7. 파이썬 핵심 디버깅 팁'
        };

        const topics = [
            // Step 1
            {
                id: 'arr_search', group: '1', title: '배열과 순차 검색',
                desc: '가장 기본적인 탐색입니다. 처음부터 끝까지 차례대로 비교합니다. 정렬되지 않은 데이터에서 사용합니다.',
                code: 'arr = [4, 9, 11, 23, 2, 19, 7]\ntarget = 23\n\nfor i in range(len(arr)):\n    if arr[i] == target:\n        print(f"찾았습니다! 인덱스: {i}")\n        break\nelse:\n    print("값을 찾지 못했습니다.")'
            },
            {
                id: 'bubble_sort', group: '1', title: '버블 정렬 (Bubble Sort)',
                desc: '인접한 두 원소를 비교하며 자리를 바꿉니다. 한 사이클이 끝나면 가장 큰 값이 맨 뒤로 밀려납니다. $O(N^2)$로 느린 편입니다.',
                code: 'arr = [55, 7, 78, 12, 42]\nn = len(arr)\n\nfor i in range(n - 1, 0, -1):\n    for j in range(i):\n        if arr[j] > arr[j + 1]:\n            arr[j], arr[j + 1] = arr[j + 1], arr[j]\n\nprint("버블 정렬 결과:", arr)'
            },
            {
                id: 'counting_sort', group: '1', title: '카운팅 정렬 (Counting Sort)',
                desc: '데이터의 값을 인덱스로 활용하여 개수를 센 뒤, 누적 합을 이용해 자리를 찾아가는 매우 빠른 정렬입니다. $O(N+K)$',
                code: 'arr = [0, 4, 1, 3, 1, 2, 4, 1]\ncounts = [0] * 5\ntemp = [0] * len(arr)\n\nfor x in arr: counts[x] += 1\nfor i in range(1, 5): counts[i] += counts[i-1]\n\nfor i in range(len(arr)-1, -1, -1):\n    counts[arr[i]] -= 1\n    temp[counts[arr[i]]] = arr[i]\n\nprint("카운팅 정렬 결과:", temp)'
            },
            {
                id: 'greedy', group: '1', title: '탐욕 알고리즘 (Greedy)',
                desc: '매 순간 최선의 선택을 합니다. Baby-gin 문제에서 유용합니다.<br/><b>💡 Tip:</b> `.replace(" ", "")`로 불순물 공백을 제거하고, `IndexError`를 막기 위해 배열을 12칸으로 넉넉히 잡는 것이 핵심입니다.',
                code: 'cards = "1 2 3 1 2 3 ".replace(" ", "")\ncounts = [0] * 12 # IndexError 방지용 넉넉한 배열\n\nfor c in cards:\n    counts[int(c)] += 1\n\nbaby_gin = 0\ni = 0\nwhile i < 10:\n    # Triplet (같은 숫자 3개)\n    if counts[i] >= 3:\n        counts[i] -= 3\n        baby_gin += 1\n        continue # 동일 숫자가 6개일 수 있으므로 제자리 다시 검사\n    \n    # Run (연속된 숫자 3개)\n    if counts[i] >= 1 and counts[i+1] >= 1 and counts[i+2] >= 1:\n        counts[i] -= 1\n        counts[i+1] -= 1\n        counts[i+2] -= 1\n        baby_gin += 1\n        continue\n    i += 1\n\nprint(f"Baby-gin 세트 개수: {baby_gin}")'
            },
            
            // Step 2
            {
                id: 'delta_search', group: '2', title: '델타 탐색 (2차원 상하좌우)',
                desc: '현재 위치에서 `di`, `dj` 배열을 사용하여 상하좌우를 탐색합니다. 배열 범위를 벗어나지 않게 유효성 체크(`0 <= ni < N`)를 하는 것이 핵심입니다.',
                code: 'arr = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\ndi = [-1, 1, 0, 0]\ndj = [0, 0, -1, 1]\n\ni, j = 1, 1\nprint(f"기준점: {arr[i][j]}")\n\nfor k in range(4):\n    ni, nj = i + di[k], j + dj[k]\n    if 0 <= ni < 3 and 0 <= nj < 3:\n        print(f"방향 {k} 인접 값: {arr[ni][nj]}")'
            },
            {
                id: 'binary_search', group: '2', title: '이진 검색 (Binary Search)',
                desc: '<b>반드시 정렬된 상태</b>에서만 쓸 수 있습니다. 중간값을 기준으로 탐색 범위를 반씩 쳐내며 매우 빠릅니다 $O(logN)$.<br/><b>💡 Tip:</b> 문제 지문에서 경계값을 어떻게 처리하는지(예: `l = c` 인지 `l = c+1`인지) 꼼꼼히 확인해야 합니다.',
                code: 'arr = [2, 4, 7, 9, 11, 19, 23]\ntarget = 19\nstart, end = 0, len(arr) - 1\n\nwhile start <= end:\n    mid = (start + end) // 2\n    if arr[mid] == target:\n        print(f"인덱스 {mid}에서 발견!")\n        break\n    elif arr[mid] > target:\n        end = mid - 1\n    else:\n        start = mid + 1\nelse:\n    print("실패")'
            },
            {
                id: 'selection_sort', group: '2', title: '선택 정렬 (Selection Sort)',
                desc: '가장 작은(또는 큰) 값을 찾아 맨 앞으로 자리를 바꾸는 방식입니다. 버블 정렬에 비해 교환 횟수가 적습니다.',
                code: 'arr = [64, 25, 12, 22, 11]\nn = len(arr)\n\nfor i in range(n - 1):\n    min_idx = i\n    for j in range(i + 1, n):\n        if arr[j] < arr[min_idx]:\n            min_idx = j\n    arr[i], arr[min_idx] = arr[min_idx], arr[i]\n\nprint("선택 정렬 결과:", arr)'
            },
            {
                id: 'python_zip', group: '2', title: '2차원 배열 & Zip() 활용 (꿀팁)',
                desc: '<b>스도쿠 문제(SWEA 1974) 완벽 대비!</b><br/>1. `zip(*maps)`를 쓰면 세로줄을 가로줄처럼 눕혀서 아주 편하게 읽을 수 있습니다.<br/>2. 3x3 격자는 4중 for문 대신 파이썬의 강력한 무기인 **슬라이싱(`[c:c+3]`)과 리스트 덧셈(`+`)**을 쓰면 훨씬 우아하게 풀립니다.',
                code: 'maps = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\n\nprint("1. 가로 세로 동시 순회 (zip 활용)")\nfor row, col in zip(maps, zip(*maps)):\n    print(f"가로: {row} | 세로: {list(col)}")\n\nprint("\\n2. 3x3 박스 슬라이싱 추출")\nr, c = 0, 0\n# 리스트끼리 더하면 하나로 이어붙여집니다.\nbox = maps[r][c:c+3] + maps[r+1][c:c+3] + maps[r+2][c:c+3]\nprint(f"추출된 박스: {box}")\nprint(f"검증(길이가 9인가?): {len(set(box)) == 9}")'
            },
            
            // Step 3
            {
                id: 'brute_force', group: '3', title: '고지식한 패턴 검색 (Brute Force)',
                desc: '본문 문자열을 순회하며 패턴을 하나씩 직접 비교합니다. 가장 무식하지만 확실한 완전 탐색입니다.',
                code: 'text = "This is a book"\npattern = "is"\n\nn, m = len(text), len(pattern)\nfor i in range(n - m + 1):\n    match = True\n    for j in range(m):\n        if text[i + j] != pattern[j]:\n            match = False\n            break\n    if match:\n        print(f"인덱스 {i}에서 패턴 매칭!")'
            },

            // Step 4
            {
                id: 'stack_intro', group: '4', title: '스택 (Stack) 기초',
                desc: 'LIFO(Last-In-First-Out, 후입선출) 구조입니다. 파이썬에서는 기본 리스트의 `append()`를 Push로, `pop()`을 Pop으로 사용합니다.',
                code: 'stack = []\nstack.append(1) # Push\nstack.append(2) # Push\nstack.append(3) # Push\nprint("현재 스택:", stack)\n\nprint("꺼낸 원소:", stack.pop()) # Pop\nprint("제일 위 원소 확인(Peek):", stack[-1])'
            },
            {
                id: 'stack_calc', group: '4', title: '후위 표기법 (Postfix)',
                desc: '중위 표기식(`6+5*(2-8)/2`)을 컴퓨터가 계산하기 쉬운 <b>후위 표기식</b>으로 바꾸는 스택의 단골 응용 문제입니다. `icp`(넣을 때 우선순위)와 `isp`(스택 안 우선순위)가 다름을 유의하세요.',
                code: 'expr = "2+3*4/5"\nstack = []\nresult = ""\nisp = {\'*\': 2, \'/\': 2, \'+\': 1, \'-\': 1, \'(\': 0}\n\nfor token in expr:\n    if token.isdecimal():\n        result += token\n    else:\n        while stack and isp[stack[-1]] >= isp[token]:\n            result += stack.pop()\n        stack.append(token)\n\nwhile stack:\n    result += stack.pop()\n    \nprint("변환된 후위 표기식:", result)'
            },
            {
                id: 'stack_dfs', group: '4', title: '깊이 우선 탐색 (DFS)',
                desc: '스택이나 재귀를 사용하여 한 우물을 끝까지 파고 들어가는 방식입니다. 갈림길을 만나면 일단 한 곳으로 가고, 막히면 되돌아옵니다(Pop).',
                code: 'graph = {\'A\': [\'B\', \'C\'], \'B\': [\'D\', \'E\'], \'C\': [], \'D\': [], \'E\': []}\nvisited = set()\n\ndef dfs(node):\n    visited.add(node)\n    print(node, end=" ")\n    for nxt in graph[node]:\n        if nxt not in visited:\n            dfs(nxt)\n\nprint("DFS 탐색 경로:"); dfs(\'A\')'
            },
            {
                id: 'memoization', group: '4', title: '메모이제이션 (Memoization)',
                desc: '재귀 함수(예: 피보나치)는 똑같은 계산을 엄청나게 반복하여 속도가 느립니다. 한 번 구한 답을 <b>메모(리스트)에 적어두고 재활용</b>하여 시간을 크게 단축시키는 기법입니다.',
                code: 'def fibo(n):\n    global cnt\n    cnt += 1\n    if n >= 2 and memo[n] == 0:\n        memo[n] = fibo(n-1) + fibo(n-2)\n    return memo[n]\n\nn = 10\ncnt = 0\nmemo = [0] * (n + 1)\nmemo[0], memo[1] = 0, 1\n\nprint(f"메모이제이션 {n}번째 피보나치: {fibo(n)}")\nprint(f"함수 호출 횟수: {cnt}번 (엄청 적습니다!)")'
            },
            {
                id: 'dp_iterative', group: '4', title: '동적 계획법 (DP)',
                desc: '메모이제이션과 아이디어는 같지만, <b>재귀 함수를 부르지 않고(오버헤드 없음)</b> 밑바닥부터 차례대로 빈칸을 채워나가는 반복문 방식입니다. 실무와 코테에서 훨씬 선호되는 방식입니다.',
                code: 'n = 10\nf = [0] * (n + 1)\nf[0], f[1] = 0, 1\n\n# 함수를 부르지 않고 직접 배열을 갱신합니다.\nfor i in range(2, n + 1):\n    f[i] = f[i-1] + f[i-2]\n\nprint(f"동적계획법 {n}번째 수: {f[n]}")'
            },
            {

        function renderTopics() {
            const listEl = document.getElementById('topic-list');
            listEl.innerHTML = '';
            
            for (const [groupId, groupName] of Object.entries(groupTitles)) {
                const groupBtn = document.createElement('div');
                groupBtn.className = 'flex items-center justify-between p-2 mt-2 bg-slate-100 rounded cursor-pointer hover:bg-slate-200 transition-colors text-slate-700';
                const isExpanded = expandedGroups[groupId];
                
                groupBtn.innerHTML = `
                    <span class="font-bold text-sm tracking-tight">${groupName}</span>
                    <svg class="w-4 h-4 text-slate-500 chevron ${isExpanded ? 'open' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                `;
                groupBtn.onclick = () => {
                    expandedGroups[groupId] = !expandedGroups[groupId];
                    renderTopics();
                };
                listEl.appendChild(groupBtn);
                
                const itemsContainer = document.createElement('div');
                itemsContainer.className = `overflow-hidden transition-all duration-300 ${isExpanded ? 'max-h-[1000px] opacity-100 mt-1' : 'max-h-0 opacity-0'}`;
                
                topics.filter(t => t.group === groupId).forEach(topic => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-3 py-2 text-sm rounded transition-all transform hover:translate-x-1 ${
                        topic.id === currentTopicId 
                        ? 'bg-blue-50 text-blue-700 font-semibold border-l-4 border-blue-600' 
                        : 'text-slate-600 hover:bg-slate-50 border-l-4 border-transparent'
                    }`;
                    btn.innerText = topic.title;
                    btn.onclick = () => selectTopic(topic.id);
                    itemsContainer.appendChild(btn);
                });
                listEl.appendChild(itemsContainer);
            }
        }

        function initEditor() {
            editor = ace.edit("editor");
            editor.setTheme("ace/theme/monokai");
            editor.session.setMode("ace/mode/python");
            editor.setOptions({
                fontSize: "14px",
                showPrintMargin: false,
                enableBasicAutocompletion: true,
                enableLiveAutocompletion: true,
                tabSize: 4,
                useSoftTabs: true
            });

            // 자동 저장
            editor.session.on('change', () => {
                if (currentTopicId) localStorage.setItem('algo_' + currentTopicId, editor.getValue());
            });
            window.addEventListener('resize', () => { if (editor) editor.resize(); });
        }

        function setupResizer() {
            const handle = document.getElementById('drag-handle-terminal');
            const editorCont = document.getElementById('editor-container');
            const terminalCont = document.getElementById('terminal-container');
            const workspace = document.getElementById('workspace-container');
            
            let isResizing = false;

            const startDrag = () => {
                isResizing = true;
                document.body.style.cursor = 'row-resize';
                // iframe이나 에디터 영역이 마우스 이벤트를 가로채는 것을 방지
                workspace.classList.add('resizing-active'); 
            };

            const doDrag = (e) => {
                if (!isResizing) return;
                
                // 모바일 터치 이벤트 스크롤 방지
                if (e.type === 'touchmove') e.preventDefault();
                
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                const workspaceRect = workspace.getBoundingClientRect();
                
                // 헤더 툴바 영역 높이 보정
                const headerOffset = 40; 
                let newEditorHeight = clientY - workspaceRect.top - headerOffset;
                
                // 최소/최대 높이 제한 (100px)
                const maxEditorHeight = workspaceRect.height - headerOffset - 100;
                
                if (newEditorHeight >= 100 && newEditorHeight <= maxEditorHeight) {
                    // Flex 속성을 덮어씌워 강제 크기 할당 (에디터는 고정 px, 터미널은 남은 공간 모두)
                    editorCont.style.flex = `0 0 ${newEditorHeight}px`;
                    terminalCont.style.flex = '1 1 0%';
                    
                    // 핵심: 크기 변경 즉시 Ace 에디터 리렌더링 (가려짐 방지)
                    if (editor) editor.resize();
                }
            };

            const stopDrag = () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    workspace.classList.remove('resizing-active');
                    if (editor) editor.resize();
                }
            };

            handle.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', doDrag);
            window.addEventListener('mouseup', stopDrag);

            handle.addEventListener('touchstart', startDrag, { passive: false });
            window.addEventListener('touchmove', doDrag, { passive: false });
            window.addEventListener('touchend', stopDrag);
        }

        function selectTopic(id) {
            currentTopicId = id;
            const topic = topics.find(t => t.id === id);
            if (!topic) return;
            
            document.getElementById('concept-title').innerText = topic.title;
            document.getElementById('concept-desc').innerHTML = topic.desc;
            
            const savedCode = localStorage.getItem('algo_' + id);
            editor.setValue(savedCode !== null ? savedCode : topic.code);
            editor.clearSelection();
            editor.gotoLine(1);
            
            document.getElementById('output').textContent = "실행 대기 중...";
            document.getElementById('exec-time').textContent = "";
            
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
            
            renderTopics();
            setTimeout(() => { if (editor) editor.resize(); }, 50);
        }

        async function loadPyodideEngine() {
            try {
                pyodideInstance = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/" });
                document.getElementById('status-badge').className = "flex items-center px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-semibold";
                document.getElementById('loader-spinner').style.display = 'none';
                document.getElementById('status-text').innerText = "파이썬 준비 완료";
                
                const runBtn = document.getElementById('run-btn');
                runBtn.disabled = false;
                runBtn.onclick = executePython;
                editor.commands.addCommand({ name: 'run', bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'}, exec: executePython });
            } catch (e) {
                document.getElementById('status-text').innerText = "엔진 로딩 실패";
                console.error(e);
            }
        }

        async function executePython() {
            if (!pyodideInstance || isExecuting) return;
            isExecuting = true;
            
            const code = editor.getValue();
            const outEl = document.getElementById('output');
            const timeEl = document.getElementById('exec-time');
            const runBtn = document.getElementById('run-btn');
            
            runBtn.disabled = true;
            runBtn.innerHTML = '실행 중...';
            outEl.textContent = "";
            timeEl.textContent = "측정 중...";

            const startT = performance.now();
            pyodideInstance.globals.set('_user_code', code);
            
            // 안전장치(Timeout & 독립공간 실행)가 포함된 파이썬 실행 래퍼 코드
            const wrapper = `
import sys, io, time, traceback
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()

class Timeout(Exception): pass

def _trace(frame, event, arg):
    if time.time() - _start > 2.0:
        raise Timeout("⏰ 실행 시간 초과 (2초): 무한 루프 발생!")
    return _trace

_start = time.time()
sys.settrace(_trace)

try:
    exec(_user_code, {}) # 독립된 namespace에서 실행 (변수 오염 방지)
except Timeout as t:
    sys.stderr.write(str(t) + "\\n")
except Exception as e:
    traceback.print_exc(file=sys.stderr)
finally:
    sys.settrace(None)

_out = sys.stdout.getvalue()
_err = sys.stderr.getvalue()
`;
            try {
                await pyodideInstance.runPythonAsync(wrapper);
                let out = pyodideInstance.globals.get('_out');
                let err = pyodideInstance.globals.get('_err');
                
                timeEl.textContent = `(${(performance.now() - startT).toFixed(1)}ms)`;
                if (out) outEl.textContent += out;
                if (err) outEl.innerHTML += `<span class="text-rose-400">${err}</span>`;
                if (!out && !err) outEl.textContent = "실행 완료 (출력 없음)";
            } catch (err) {
                timeEl.textContent = `(오류)`;
                outEl.innerHTML = `<span class="text-rose-400 font-bold">${err.toString()}</span>`;
            } finally {
                isExecuting = false;
                runBtn.disabled = false;
                runBtn.innerHTML = '코드 실행';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initEditor();
            setupResizer();
            // topics 데이터 배열이 로드된 후에 실행
            selectTopic(topics[0].id);
            loadPyodideEngine();
            
            // 버튼 이벤트
            document.getElementById('mobile-menu-btn').onclick = () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
                document.getElementById('sidebar-backdrop').classList.remove('hidden');
            };
            document.getElementById('close-sidebar-btn').onclick = 
            document.getElementById('sidebar-backdrop').onclick = () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-backdrop').classList.add('hidden');
            };
            
            document.getElementById('reset-btn').onclick = () => {
                if (currentTopicId) {
                    localStorage.removeItem('algo_' + currentTopicId);
                    const t = topics.find(x => x.id === currentTopicId);
                    editor.setValue(t.code);
                    editor.clearSelection();
                }
            };
            
            document.getElementById('copy-btn').onclick = () => {
                navigator.clipboard.writeText(editor.getValue()).then(() => {
                    const btn = document.getElementById('copy-btn');
                    btn.innerHTML = '<span class="text-emerald-400">복사됨!</span>';
                    setTimeout(() => btn.innerHTML = '복사', 1500);
                });
            };
            
            document.getElementById('clear-btn').onclick = () => {
                document.getElementById('output').textContent = "";
                document.getElementById('exec-time').textContent = "";
            };
        });
    </script>
